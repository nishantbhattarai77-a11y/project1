<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A cheerful hello world page." />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f6f3ff;
        --muted: #c9c4dc;
        --purple: #a970ff;
        --cyan: #53e5ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #100b25;
      }

      .orb {
        position: fixed;
        width: 34rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(18px);
        opacity: .45;
        animation: float 12s ease-in-out infinite alternate;
      }

      .orb.one { top: -15rem; left: -10rem; background: #913cff; }
      .orb.two { right: -13rem; bottom: -14rem; background: #00c7e9; animation-delay: -4s; }

      main {
        position: relative;
        width: min(92vw, 760px);
        padding: clamp(2.5rem, 7vw, 5.5rem);
        text-align: center;
        background: linear-gradient(135deg, rgb(255 255 255 / 15%), rgb(255 255 255 / 4%));
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 2rem;
        box-shadow: 0 2rem 5rem rgb(0 0 0 / 32%);
        backdrop-filter: blur(18px);
        animation: enter .8s cubic-bezier(.2, .8, .2, 1) both;
      }

      .eyebrow {
        margin: 0 0 1.4rem;
        color: var(--cyan);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 11vw, 7rem);
        line-height: .95;
        letter-spacing: -.07em;
        background: linear-gradient(120deg, #fff 20%, var(--cyan) 52%, #d6baff 80%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 34rem;
        margin: 1.75rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.18rem);
        line-height: 1.7;
      }

      .sparkle {
        display: inline-grid;
        place-items: center;
        width: 2.8rem;
        height: 2.8rem;
        margin-top: 2rem;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 50%;
        background: rgb(255 255 255 / 10%);
        font-size: 1.35rem;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes enter { from { opacity: 0; transform: translateY(28px) scale(.96); } }
      @keyframes float { to { transform: translate(5rem, 3rem) scale(1.1); } }
      @keyframes pulse { 50% { transform: scale(1.12) rotate(14deg); box-shadow: 0 0 2rem #a970ff88; } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb one" aria-hidden="true"></div>
    <div class="orb two" aria-hidden="true"></div>
    <main>
      <p class="eyebrow">A bright beginning</p>
      <h1>Hello, World!</h1>
      <p>One small page, a whole universe of possibilities. Make something wonderful today.</p>
      <span class="sparkle" aria-label="sparkles">✦</span>
    </main>
  </body>
</html>
